<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>状态简报</title>
<style>
  :root {
    --bg: #ffffff; --surface: #f6f7f9; --line: #e6e8ec;
    --text: #1b2130; --text-2: #434b5b; --muted: #6a7282;
    --good: #1d8052; --good-soft: #cfe8da; --warn: #a35f00; --warn-soft: #f3dfbd;
    --bad: #c93636; --bad-soft: #f2cccc; --none: #e3e6ea;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); font-family: "PingFang SC", "Noto Sans CJK SC", "Source Han Sans SC", "Microsoft YaHei", sans-serif; color: var(--text); -webkit-font-smoothing: antialiased; }
  #card { width: 720px; padding: 36px 40px 28px; background: var(--bg); }
  .head { display: flex; justify-content: space-between; align-items: baseline; color: var(--muted); font-size: 14px; }
  .head strong { color: var(--text); font-size: 15px; font-weight: 600; }
  .verdict { display: flex; align-items: center; gap: 12px; margin-top: 22px; font-size: 28px; font-weight: 650; line-height: 1.25; }
  .verdict i { width: 14px; height: 14px; border-radius: 50%; background: var(--c); flex-shrink: 0; }
  .summary { margin-top: 10px; color: var(--text-2); font-size: 17px; line-height: 1.6; text-wrap: pretty; }
  .metrics { display: flex; gap: 40px; margin-top: 24px; padding: 16px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .metric span { display: block; color: var(--muted); font-size: 13px; }
  .metric b { display: block; margin-top: 2px; font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .metric b small { margin-left: 2px; color: var(--muted); font-size: 14px; font-weight: 500; }
  .groups { margin-top: 22px; }
  .groups h2 { color: var(--muted); font-size: 13px; font-weight: 500; margin-bottom: 6px; }
  .row { display: grid; grid-template-columns: 112px 1fr 84px; align-items: center; gap: 16px; padding: 11px 0; }
  .row + .row { border-top: 1px solid var(--line); }
  .row.focus { margin: 0 -12px; padding: 11px 12px; background: var(--surface); border-radius: 8px; }
  .row.focus + .row { border-top-color: transparent; }
  .name { font-size: 16px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bars { display: flex; align-items: flex-end; gap: 3px; height: 30px; }
  .bars i { flex: 1; min-height: 4px; border-radius: 2px; background: var(--c); }
  .rate { text-align: right; font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--c); }
  .axis { display: grid; grid-template-columns: 112px 1fr 84px; gap: 16px; color: var(--muted); font-size: 12px; margin-top: 2px; }
  .axis div { display: flex; justify-content: space-between; }
  .foot { display: flex; justify-content: space-between; margin-top: 20px; color: var(--muted); font-size: 13px; }
  .foot .legend { display: flex; gap: 14px; }
  .foot .legend span::before { content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 5px; border-radius: 2px; background: var(--c); }
</style>
</head>
<body>
<div id="card"></div>
<script>
(function () {
  const d = window.STATUS_DATA;
  const card = document.getElementById('card');
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const level = r => r == null ? 'none' : r >= 99 ? 'good' : r >= 95 ? 'warn' : 'bad';
  const color = r => `var(--${level(r)})`;
  const pct = r => r == null ? '—' : (r >= 99.995 ? '100' : r.toFixed(2)) + '%';
  const count = n => n == null ? '—' : n >= 10000 ? (n / 10000).toFixed(1) + '<small>万</small>' : n.toLocaleString('zh-CN');
  const ms = v => v == null ? '—' : v >= 1000 ? (v / 1000).toFixed(2) + '<small>s</small>' : Math.round(v) + '<small>ms</small>';
  const time = iso => { const t = new Date(iso); if (isNaN(t)) return ''; const p = Object.fromEntries(new Intl.DateTimeFormat('zh-CN', { timeZone: 'Asia/Shanghai', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).formatToParts(t).map(x => [x.type, x.value])); return `${p.month}月${p.day}日 ${p.hour}:${p.minute}`; };

  const rates = (d.groups || []).map(g => g.successRate).filter(r => r != null);
  const worst = rates.length ? Math.min(...rates) : d.overall?.successRate;
  const verdict = { good: '运行正常', warn: '部分分组波动', bad: '部分分组异常', none: '暂无数据' }[level(worst)];
  const bars = series => {
    const vals = series || [];
    return vals.map(v => `<i style="height:${v == null ? 4 : Math.max(4, Math.min(30, 4 + (v - 90) * 2.6))}px;--c:var(--${v == null ? 'none' : level(v) + (v >= 99 ? '-soft' : '')})"></i>`).join('');
  };
  const periods = d.window?.periods || [];
  const ticks = periods.length ? [periods[0], periods[Math.floor(periods.length / 2)], periods[periods.length - 1]] : [];

  card.innerHTML = `
    <div class="head"><strong>${esc(d.site)} · ${esc(d.title || '服务状态')}</strong><span>${time(d.generatedAt)}</span></div>
    <div class="verdict" style="--c:${color(worst)}"><i></i>${verdict}</div>
    ${d.summary ? `<p class="summary">${esc(d.summary)}</p>` : ''}
    <div class="metrics">
      <div class="metric"><span>整体成功率</span><b style="color:${color(d.overall?.successRate)}">${pct(d.overall?.successRate)}</b></div>
      <div class="metric"><span>请求数</span><b>${count(d.overall?.requests)}</b></div>
      <div class="metric"><span>首字延迟中位数</span><b>${ms(d.overall?.medianTtftMs)}</b></div>
    </div>
    <div class="groups">
      <h2>各分组 · ${esc(d.window?.label || '')}</h2>
      ${(d.groups || []).map(g => `
        <div class="row${d.focus && g.name === d.focus ? ' focus' : ''}" style="--c:${color(g.successRate)}">
          <div class="name">${esc(g.name)}</div>
          <div class="bars">${bars(g.series)}</div>
          <div class="rate">${pct(g.successRate)}</div>
        </div>`).join('')}
      ${ticks.length ? `<div class="axis"><span></span><div>${ticks.map(t => `<span>${esc(t)}</span>`).join('')}</div><span></span></div>` : ''}
    </div>
    <div class="foot">
      <span>柱子越高成功率越高</span>
      <div class="legend"><span style="--c:var(--good-soft)">≥ 99%</span><span style="--c:var(--warn)">95–99%</span><span style="--c:var(--bad)">&lt; 95%</span><span style="--c:var(--none)">无数据</span></div>
    </div>`;
  document.body.dataset.ready = '1';
})();
</script>
</body>
</html>
